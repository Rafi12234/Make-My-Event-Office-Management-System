name: Deploy MME Office to cPanel

"on":
  push:
    branches:
      - main

  workflow_dispatch:

concurrency:
  group: mme-office-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  BACKEND_DIR: backend/mme_node_express_backend
  FRONTEND_DIR: frontend/make my event office management system

  APP_DIR: /home/datapulseglobal/mme-office-app

  PRODUCTION_URL: https://mme-office.datapulseglobal.com
  VITE_API_BASE_URL: https://mme-office.datapulseglobal.com/api

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ---------------------------------------------------------
      # 1. Download the latest source code
      # ---------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------------------------------------------------------
      # 2. Use the same Node.js version as cPanel
      # ---------------------------------------------------------
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.20.2"
          cache: npm
          cache-dependency-path: |
            backend/mme_node_express_backend/package-lock.json
            frontend/make my event office management system/package-lock.json

      # ---------------------------------------------------------
      # 3. Install and validate backend dependencies
      # ---------------------------------------------------------
      - name: Validate backend
        working-directory: ${{ env.BACKEND_DIR }}
        run: |
          npm config set registry https://registry.npmjs.org/

          npm ci --no-audit --no-fund

          node --check app.js
          node --check src/server.js

          echo "Backend validation completed."

      # ---------------------------------------------------------
      # 4. Install frontend dependencies and build React
      # ---------------------------------------------------------
      - name: Build frontend
        working-directory: ${{ env.FRONTEND_DIR }}
        env:
          VITE_API_BASE_URL: ${{ env.VITE_API_BASE_URL }}
        run: |
          npm config set registry https://registry.npmjs.org/

          npm ci --include=dev --no-audit --no-fund

          if [ ! -x "node_modules/.bin/vite" ]; then
            echo "Vite was not installed."
            exit 1
          fi

          npm run build

          echo "Frontend build completed."

      # ---------------------------------------------------------
      # 5. Confirm all required deployment files exist
      # ---------------------------------------------------------
      - name: Validate deployment files
        run: |
          test -f "${BACKEND_DIR}/app.js"
          test -f "${BACKEND_DIR}/package.json"
          test -f "${BACKEND_DIR}/package-lock.json"
          test -f "${BACKEND_DIR}/src/server.js"

          test -f "${FRONTEND_DIR}/dist/index.html"
          test -d "${FRONTEND_DIR}/dist/assets"

          grep -Fq "express.static" \
            "${BACKEND_DIR}/src/server.js"

          grep -Fq "../public" \
            "${BACKEND_DIR}/src/server.js"

          echo "Deployment files validated."

      # ---------------------------------------------------------
      # 6. Create backend and frontend deployment archives
      # ---------------------------------------------------------
      - name: Create deployment archives
        run: |
          BACKEND_FILES=(
            app.js
            package.json
            package-lock.json
            src
          )

          if [ -d "${BACKEND_DIR}/database" ]; then
            BACKEND_FILES+=(database)
          fi

          tar -czf "mme-backend-${GITHUB_SHA}.tar.gz" \
            -C "${BACKEND_DIR}" \
            "${BACKEND_FILES[@]}"

          tar -czf "mme-frontend-${GITHUB_SHA}.tar.gz" \
            -C "${FRONTEND_DIR}/dist" \
            .

          test -s "mme-backend-${GITHUB_SHA}.tar.gz"
          test -s "mme-frontend-${GITHUB_SHA}.tar.gz"

          echo "Deployment archives created."

      # ---------------------------------------------------------
      # 7. Configure SSH
      # ---------------------------------------------------------
      - name: Configure SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}

          SSH_PORT: ${{ vars.SSH_PORT }}
          NODE_ACTIVATE: ${{ vars.NODE_ACTIVATE }}
        run: |
          test -n "$SSH_HOST"
          test -n "$SSH_USERNAME"
          test -n "$SSH_PRIVATE_KEY"
          test -n "$SSH_PORT"
          test -n "$NODE_ACTIVATE"

          install -m 700 -d "$HOME/.ssh"

          printf '%s\n' "$SSH_PRIVATE_KEY" \
            | tr -d '\r' \
            > "$HOME/.ssh/mme_deploy_key"

          chmod 600 "$HOME/.ssh/mme_deploy_key"

          for attempt in 1 2 3; do
            echo "Getting SSH host key: attempt $attempt"

            if ssh-keyscan \
              -p "$SSH_PORT" \
              -H "$SSH_HOST" \
              > "$HOME/.ssh/known_hosts"; then
              break
            fi

            sleep 3
          done

          chmod 600 "$HOME/.ssh/known_hosts"

          test -s "$HOME/.ssh/known_hosts"

          echo "SSH configuration completed."

      # ---------------------------------------------------------
      # 8. Test GitHub Actions to cPanel SSH connection
      # ---------------------------------------------------------
      - name: Test SSH connection
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}

          SSH_PORT: ${{ vars.SSH_PORT }}
          NODE_ACTIVATE: ${{ vars.NODE_ACTIVATE }}
        run: |
          ssh \
            -i "$HOME/.ssh/mme_deploy_key" \
            -p "$SSH_PORT" \
            -o BatchMode=yes \
            -o ConnectTimeout=20 \
            -o StrictHostKeyChecking=yes \
            "$SSH_USERNAME@$SSH_HOST" \
            "test -d '${APP_DIR}' &&
             test -f '${APP_DIR}/app.js' &&
             test -f '${NODE_ACTIVATE}' &&
             echo 'SSH and cPanel application verified'"

      # ---------------------------------------------------------
      # 9. Upload backend and frontend archives
      # ---------------------------------------------------------
      - name: Upload deployment archives
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
          SSH_PORT: ${{ vars.SSH_PORT }}
        run: |
          scp \
            -i "$HOME/.ssh/mme_deploy_key" \
            -P "$SSH_PORT" \
            -o StrictHostKeyChecking=yes \
            "mme-backend-${GITHUB_SHA}.tar.gz" \
            "mme-frontend-${GITHUB_SHA}.tar.gz" \
            "$SSH_USERNAME@$SSH_HOST:~/"

          echo "Deployment archives uploaded."

      # ---------------------------------------------------------
      # 10. Deploy backend and frontend to cPanel
      # ---------------------------------------------------------
      - name: Deploy application
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}

          SSH_PORT: ${{ vars.SSH_PORT }}
          NODE_ACTIVATE: ${{ vars.NODE_ACTIVATE }}
        run: |
          ssh \
            -i "$HOME/.ssh/mme_deploy_key" \
            -p "$SSH_PORT" \
            -o StrictHostKeyChecking=yes \
            "$SSH_USERNAME@$SSH_HOST" \
            "APP_DIR='${APP_DIR}' \
             RELEASE_ID='${GITHUB_SHA}' \
             NODE_ACTIVATE='${NODE_ACTIVATE}' \
             bash -s" <<'REMOTE_SCRIPT'

          set -Eeuo pipefail

          BACKEND_ARCHIVE="$HOME/mme-backend-$RELEASE_ID.tar.gz"
          FRONTEND_ARCHIVE="$HOME/mme-frontend-$RELEASE_ID.tar.gz"

          STAGE_DIR="$HOME/.mme-deployment-$RELEASE_ID"

          cleanup() {
            rm -rf "$STAGE_DIR"

            rm -f \
              "$BACKEND_ARCHIVE" \
              "$FRONTEND_ARCHIVE"
          }

          trap cleanup EXIT

          echo "Checking uploaded archives..."

          test -f "$BACKEND_ARCHIVE"
          test -f "$FRONTEND_ARCHIVE"
          test -f "$NODE_ACTIVATE"

          echo "Creating temporary deployment folder..."

          rm -rf "$STAGE_DIR"

          mkdir -p \
            "$STAGE_DIR/backend" \
            "$STAGE_DIR/frontend"

          echo "Extracting backend..."

          tar -xzf "$BACKEND_ARCHIVE" \
            -C "$STAGE_DIR/backend"

          echo "Extracting frontend..."

          tar -xzf "$FRONTEND_ARCHIVE" \
            -C "$STAGE_DIR/frontend"

          echo "Validating extracted application..."

          test -f "$STAGE_DIR/backend/app.js"
          test -f "$STAGE_DIR/backend/package.json"
          test -f "$STAGE_DIR/backend/package-lock.json"
          test -f "$STAGE_DIR/backend/src/server.js"

          test -f "$STAGE_DIR/frontend/index.html"
          test -d "$STAGE_DIR/frontend/assets"

          mkdir -p \
            "$APP_DIR" \
            "$APP_DIR/tmp"

          echo "Updating backend package files..."

          cp \
            "$STAGE_DIR/backend/app.js" \
            "$APP_DIR/app.js"

          cp \
            "$STAGE_DIR/backend/package.json" \
            "$APP_DIR/package.json"

          cp \
            "$STAGE_DIR/backend/package-lock.json" \
            "$APP_DIR/package-lock.json"

          echo "Activating cPanel Node.js environment..."

          source "$NODE_ACTIVATE"

          export NODE_ENV=production

          cd "$APP_DIR"

          echo "Installing production backend dependencies..."

          npm config set registry https://registry.npmjs.org/

          npm install \
            --omit=dev \
            --no-audit \
            --no-fund

          echo "Preparing updated backend source..."

          rm -rf "$APP_DIR/src.next"

          cp -a \
            "$STAGE_DIR/backend/src" \
            "$APP_DIR/src.next"

          test -f "$APP_DIR/src.next/server.js"

          echo "Preparing updated frontend build..."

          rm -rf "$APP_DIR/public.next"

          cp -a \
            "$STAGE_DIR/frontend" \
            "$APP_DIR/public.next"

          test -f "$APP_DIR/public.next/index.html"
          test -d "$APP_DIR/public.next/assets"

          echo "Replacing backend source..."

          rm -rf "$APP_DIR/src"

          mv \
            "$APP_DIR/src.next" \
            "$APP_DIR/src"

          echo "Replacing frontend build..."

          rm -rf "$APP_DIR/public"

          mv \
            "$APP_DIR/public.next" \
            "$APP_DIR/public"

          if [ -d "$STAGE_DIR/backend/database" ]; then
            echo "Updating database migration files..."

            rm -rf "$APP_DIR/database.next"

            cp -a \
              "$STAGE_DIR/backend/database" \
              "$APP_DIR/database.next"

            rm -rf "$APP_DIR/database"

            mv \
              "$APP_DIR/database.next" \
              "$APP_DIR/database"
          fi

          echo "Restarting Passenger application..."

          mkdir -p "$APP_DIR/tmp"

          touch "$APP_DIR/tmp/restart.txt"

          echo "Deployment completed successfully."

          REMOTE_SCRIPT

      # ---------------------------------------------------------
      # 11. Wait for Passenger to restart
      # ---------------------------------------------------------
      - name: Wait for application restart
        run: sleep 12

      # ---------------------------------------------------------
      # 12. Verify backend and MySQL connection
      # ---------------------------------------------------------
      - name: Verify backend health
        run: |
          for attempt in {1..12}; do
            echo "Health-check attempt: $attempt"

            if RESPONSE="$(
              curl \
                --fail \
                --silent \
                --show-error \
                "${PRODUCTION_URL}/api/health"
            )"; then
              echo "$RESPONSE"

              echo "$RESPONSE" |
                jq -e '
                  .success == true and
                  .status == "ok" and
                  .database == "connected"
                '

              echo "Backend health check passed."

              exit 0
            fi

            sleep 5
          done

          echo "Backend health check failed."

          exit 1

      # ---------------------------------------------------------
      # 13. Verify React frontend
      # ---------------------------------------------------------
      - name: Verify frontend
        run: |
          PAGE="$(
            curl \
              --fail \
              --silent \
              --show-error \
              --retry 5 \
              --retry-delay 3 \
              "${PRODUCTION_URL}/"
          )"

          echo "$PAGE" |
            grep -qi "<!doctype html>"

          echo "Frontend verification passed."