name: Deploy MME Office to cPanel

"on":
  push:
    branches:
      - main

  workflow_dispatch:

concurrency:
  group: mme-office-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  BACKEND_DIR: backend/mme_node_express_backend
  FRONTEND_DIR: frontend/make my event office management system

  APP_DIR: /home/datapulseglobal/mme-office-app

  PRODUCTION_URL: https://mme-office.datapulseglobal.com
  VITE_API_BASE_URL: https://mme-office.datapulseglobal.com/api

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ---------------------------------------------------------
      # 1. Download the latest source code
      # ---------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------------------------------------------------------
      # 2. Use the same Node.js version as cPanel
      # ---------------------------------------------------------
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.20.2"
          cache: npm
          cache-dependency-path: |
            backend/mme_node_express_backend/package-lock.json
            frontend/make my event office management system/package-lock.json

      # ---------------------------------------------------------
      # 3. Install and validate backend dependencies
      # ---------------------------------------------------------
      - name: Validate backend
        working-directory: ${{ env.BACKEND_DIR }}
        run: |
          npm config set registry https://registry.npmjs.org/

          npm ci --no-audit --no-fund

          node --check app.js
          node --check src/server.js

          echo "Backend validation completed."

      # ---------------------------------------------------------
      # 4. Install frontend dependencies and build React
      # ---------------------------------------------------------
      - name: Build frontend
        working-directory: ${{ env.FRONTEND_DIR }}
        env:
          VITE_API_BASE_URL: ${{ env.VITE_API_BASE_URL }}
        run: |
          npm config set registry https://registry.npmjs.org/

          npm ci --include=dev --no-audit --no-fund

          if [ ! -x "node_modules/.bin/vite" ]; then
            echo "Vite was not installed."
            exit 1
          fi

          npm run build

          echo "Frontend build completed."

      # ---------------------------------------------------------
      # 5. Confirm all required deployment files exist
      # ---------------------------------------------------------
      - name: Validate deployment files
        run: |
          test -f "${BACKEND_DIR}/app.js"
          test -f "${BACKEND_DIR}/package.json"
          test -f "${BACKEND_DIR}/package-lock.json"
          test -f "${BACKEND_DIR}/src/server.js"
          test -f "${BACKEND_DIR}/src/utils/dbDates.js"
          test -d "${BACKEND_DIR}/src/controllers"
          test -f "${BACKEND_DIR}/prisma/schema.prisma"
          test -f "${BACKEND_DIR}/prisma.config.ts"

          # cPanel's manual "Run NPM Install" does not run the
          # postinstall "prisma generate" hook, so the generated
          # Prisma Client (node_modules/.prisma/client) never gets
          # created there. CI generates it (via npm ci's postinstall)
          # and this workflow uploads it directly over SFTP below —
          # confirm it actually exists before we rely on it.
          test -f "${BACKEND_DIR}/node_modules/.prisma/client/index.js"
          test -f "${BACKEND_DIR}/node_modules/.prisma/client/default.js"

          test -f "${FRONTEND_DIR}/dist/index.html"
          test -d "${FRONTEND_DIR}/dist/assets"

          grep -Fq "express.static" \
            "${BACKEND_DIR}/src/server.js"

          grep -Fq "../public" \
            "${BACKEND_DIR}/src/server.js"

          echo "Deployment files validated."

      # ---------------------------------------------------------
      # 6. Configure SSH (used for the SFTP subsystem only —
      #    this cPanel account has interactive shell/exec disabled,
      #    so no `ssh user@host "command"` calls work. SFTP does
      #    NOT go through the login shell, so file transfers work
      #    even though remote command execution does not.
      # ---------------------------------------------------------
      - name: Configure SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_PORT: ${{ vars.SSH_PORT }}
        run: |
          test -n "$SSH_HOST"
          test -n "$SSH_USERNAME"
          test -n "$SSH_PRIVATE_KEY"
          test -n "$SSH_PORT"

          install -m 700 -d "$HOME/.ssh"

          printf '%s\n' "$SSH_PRIVATE_KEY" \
            | tr -d '\r' \
            > "$HOME/.ssh/mme_deploy_key"

          chmod 600 "$HOME/.ssh/mme_deploy_key"

          for attempt in 1 2 3; do
            echo "Getting SSH host key: attempt $attempt"

            if ssh-keyscan \
              -p "$SSH_PORT" \
              -H "$SSH_HOST" \
              > "$HOME/.ssh/known_hosts"; then
              break
            fi

            sleep 3
          done

          chmod 600 "$HOME/.ssh/known_hosts"

          test -s "$HOME/.ssh/known_hosts"

          echo "SSH configuration completed."

      # ---------------------------------------------------------
      # 7. Confirm the SFTP subsystem is reachable
      #    (interactive shell is disabled on this account, so this
      #    intentionally never runs a remote command — only a
      #    pure SFTP "pwd" to prove file-transfer connectivity).
      # ---------------------------------------------------------
      - name: Test SFTP connection
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
          SSH_PORT: ${{ vars.SSH_PORT }}
        run: |
          echo "pwd" > sftp_ping.txt

          sftp \
            -i "$HOME/.ssh/mme_deploy_key" \
            -P "$SSH_PORT" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -b sftp_ping.txt \
            "$SSH_USERNAME@$SSH_HOST"

          echo "SFTP connection verified."

      # ---------------------------------------------------------
      # 8. Deploy frontend + backend straight over SFTP
      #
      # No remote command execution is available on this host, so
      # this step ONLY performs file-transfer operations (put, rm,
      # mkdir) — everything the SFTP subsystem supports without a
      # working interactive shell.
      #
      # Trade-off: because "npm install" cannot be run remotely,
      # backend dependencies are NOT reinstalled automatically. If
      # package.json/package-lock.json changed, run "NPM Install"
      # manually from cPanel's "Setup Node.js App" screen after this
      # workflow finishes.
      # ---------------------------------------------------------
      - name: Deploy via SFTP
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
          SSH_PORT: ${{ vars.SSH_PORT }}
        run: |
          FRONTEND_DIST="$GITHUB_WORKSPACE/${FRONTEND_DIR}/dist"
          BACKEND_ROOT="$GITHUB_WORKSPACE/${BACKEND_DIR}"

          : > "$GITHUB_WORKSPACE/restart-trigger.txt"

          {
            echo "cd ${APP_DIR}"
            echo "-mkdir public"
            echo "-mkdir public/assets"
            echo "-rm public/assets/*"
            echo "lcd \"$FRONTEND_DIST\""
            echo "put index.html public/index.html"
            echo "put favicon.svg public/favicon.svg"
            echo "put icons.svg public/icons.svg"
            echo "lcd \"$FRONTEND_DIST/assets\""
            echo "put * public/assets/"

            echo "cd ${APP_DIR}"
            echo "-mkdir src"
            echo "-mkdir src/config"
            echo "-mkdir src/controllers"
            echo "-mkdir src/middleware"
            echo "-mkdir src/routes"
            echo "-mkdir src/utils"
            echo "lcd \"$BACKEND_ROOT/src\""
            echo "put server.js src/server.js"
            echo "lcd \"$BACKEND_ROOT/src/config\""
            echo "put * src/config/"
            echo "lcd \"$BACKEND_ROOT/src/controllers\""
            echo "put * src/controllers/"
            echo "lcd \"$BACKEND_ROOT/src/middleware\""
            echo "put * src/middleware/"
            echo "lcd \"$BACKEND_ROOT/src/routes\""
            echo "put * src/routes/"
            echo "lcd \"$BACKEND_ROOT/src/utils\""
            echo "put * src/utils/"

            echo "cd ${APP_DIR}"
            echo "-mkdir prisma"
            echo "-mkdir prisma/migrations"
            echo "-mkdir prisma/migrations/0_init"
            echo "lcd \"$BACKEND_ROOT/prisma\""
            echo "put schema.prisma prisma/schema.prisma"
            echo "lcd \"$BACKEND_ROOT/prisma/migrations/0_init\""
            echo "put migration.sql prisma/migrations/0_init/migration.sql"

            # Upload the already-generated Prisma Client. cPanel's
            # "Run NPM Install" button does not run the postinstall
            # "prisma generate" hook, so without this the server ends
            # up with @prisma/client installed but no generated code,
            # causing: "does not provide an export named 'PrismaClient'".
            # This generated output is pure JS + WASM (no native
            # binaries), so it is portable between the CI runner and
            # the cPanel server regardless of OS/Node version.
            echo "cd ${APP_DIR}"
            echo "-mkdir node_modules"
            echo "-mkdir node_modules/.prisma"
            echo "-mkdir node_modules/.prisma/client"
            echo "lcd \"$BACKEND_ROOT/node_modules/.prisma/client\""
            echo "put * node_modules/.prisma/client/"

            echo "cd ${APP_DIR}"
            echo "lcd \"$BACKEND_ROOT\""
            echo "put app.js"
            echo "put package.json"
            echo "put package-lock.json"
            echo "put prisma.config.ts"

            echo "-mkdir tmp"
            echo "lcd \"$GITHUB_WORKSPACE\""
            echo "put restart-trigger.txt tmp/restart.txt"
            echo "bye"
          } > "$GITHUB_WORKSPACE/sftp_deploy.txt"

          cat "$GITHUB_WORKSPACE/sftp_deploy.txt"

          sftp \
            -i "$HOME/.ssh/mme_deploy_key" \
            -P "$SSH_PORT" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -b "$GITHUB_WORKSPACE/sftp_deploy.txt" \
            "$SSH_USERNAME@$SSH_HOST"

          echo "SFTP deployment completed."
          echo "NOTE: backend dependencies are NOT auto-installed (no shell exec available)."
          echo "If package.json changed, run 'NPM Install' manually in cPanel's Setup Node.js App page."

      # ---------------------------------------------------------
      # 9. Wait for Passenger to restart
      # ---------------------------------------------------------
      - name: Wait for application restart
        run: sleep 12

      # ---------------------------------------------------------
      # 10. Verify backend and MySQL connection
      # ---------------------------------------------------------
      - name: Verify backend health
        run: |
          for attempt in {1..12}; do
            echo "Health-check attempt: $attempt"

            if RESPONSE="$(
              curl \
                --fail \
                --silent \
                --show-error \
                -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/125.0.0.0 Safari/537.36" \
                -H "Accept: application/json" \
                "${PRODUCTION_URL}/api/health"
            )"; then
              echo "$RESPONSE"

              if echo "$RESPONSE" |
                jq -e '
                  .success == true and
                  .status == "ok" and
                  .database == "connected"
                ' > /dev/null; then
                echo "Backend health check passed."

                exit 0
              fi

              echo "Response was not the expected JSON (likely an intermediary page, e.g. a hosting WAF/bot-check interstitial, instead of the app)."
              echo "--- first 300 characters of response ---"
              echo "$RESPONSE" | head -c 300
              echo
            fi

            sleep 5
          done

          echo "Backend health check failed."
          echo ""
          echo "A persistent 503 (not a WAF/JS-challenge HTML page) means the Node.js"
          echo "process itself is not starting on the server — almost always because"
          echo "package.json changed (new/updated dependencies) but 'npm install' was"
          echo "never run in cPanel, since this deployment method has no remote shell"
          echo "access and can only transfer files via SFTP."
          echo ""
          echo "Fix: log into cPanel -> Setup Node.js App -> open this application ->"
          echo "click 'Run NPM Install' -> then click 'Restart'. This is required once"
          echo "after every commit that changes backend/mme_node_express_backend/package.json."

          exit 1

      # ---------------------------------------------------------
      # 10b. On health-check failure, pull the server-side error
      #      logs via SFTP so the actual crash reason (e.g. "Cannot
      #      find module '@prisma/client'") is visible right here in
      #      the Actions log — no remote shell exec is available, so
      #      this only performs read-only SFTP "get" operations.
      # ---------------------------------------------------------
      - name: Fetch backend error logs (diagnostics)
        if: failure()
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
          SSH_PORT: ${{ vars.SSH_PORT }}
        run: |
          CPANEL_HOME="$(dirname "${APP_DIR}")"
          DOMAIN="$(echo "${PRODUCTION_URL}" | sed -E 's#^https?://##')"

          {
            echo "-get ${CPANEL_HOME}/logs/${DOMAIN}.error.log domain-error.log"
            echo "-get ${APP_DIR}/stderr.log app-stderr.log"
            echo "-get ${APP_DIR}/logs/error.log app-error.log"
            echo "bye"
          } > sftp_diag.txt

          sftp \
            -i "$HOME/.ssh/mme_deploy_key" \
            -P "$SSH_PORT" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -b sftp_diag.txt \
            "$SSH_USERNAME@$SSH_HOST" || true

          for f in domain-error.log app-stderr.log app-error.log; do
            echo "--- ${f} (last 100 lines) ---"
            if [ -f "$f" ]; then
              tail -n 100 "$f"
            else
              echo "(not found at the expected path, or not readable via SFTP)"
            fi
            echo ""
          done

      # ---------------------------------------------------------
      # 11. Verify React frontend
      #
      # This does more than check for a doctype — it confirms the
      # live page actually references the SAME hashed JS bundle that
      # was just built in this run. A stale deploy (e.g. the SFTP
      # step silently failing) would serve an OLD index.html
      # pointing at a DIFFERENT hashed filename, which this catches.
      # ---------------------------------------------------------
      - name: Verify frontend
        run: |
          EXPECTED_JS="$(
            grep -oE 'assets/index-[A-Za-z0-9_-]+\.js' \
              "${FRONTEND_DIR}/dist/index.html" \
              | head -n1
          )"

          test -n "$EXPECTED_JS"

          echo "Expecting live page to reference: $EXPECTED_JS"

          PAGE="$(
            curl \
              --fail \
              --silent \
              --show-error \
              --retry 5 \
              --retry-delay 3 \
              -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/125.0.0.0 Safari/537.36" \
              "${PRODUCTION_URL}/"
          )"

          echo "$PAGE" |
            grep -qi "<!doctype html>"

          if ! echo "$PAGE" | grep -qF "$EXPECTED_JS"; then
            echo "Live page does NOT reference the freshly built bundle ($EXPECTED_JS)."
            echo "The deployment likely did not actually update index.html on the server."
            echo "--- Live page received ---"
            echo "$PAGE"
            exit 1
          fi

          echo "Frontend verification passed — live page serves the current build."